name: Life simulation browser checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run story:test
      - run: npm run build
      - run: npx playwright install --with-deps chrome webkit
      - run: npm run test:e2e -- tests/life-sim.spec.ts
      - run: npm run test:e2e -- --config playwright.webkit.config.ts
